<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="clock">

        <h1>Horario de Brasília</h1>

        <div class="time">

            <div class="time-box">
                <span id="hours">00</span>
                <p>Horas</p>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <p>Minutos</p>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <p>Segundos</p>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
